services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: books-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"
    ports:
      - "1433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrongPassword123!' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql-tools:latest
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./Database/init.sql:/init.sql
    command: >
      /opt/mssql-tools/bin/sqlcmd
      -S sqlserver
      -U sa
      -P "YourStrongPassword123!"
      -C
      -i /init.sql